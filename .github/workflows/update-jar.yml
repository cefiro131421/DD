name: 更新awJar

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-jar:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: pip install requests
        
      - name: 运行更新脚本
        run: python update_jar.py
        
      - name: 提交并推送更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jar/
          git diff --staged --quiet || git commit -m "🔄 自动更新jar包 [skip ci]"
          git push
